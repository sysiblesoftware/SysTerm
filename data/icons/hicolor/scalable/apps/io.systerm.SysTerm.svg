<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="hexFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6fe0"/>
      <stop offset="1" stop-color="#182c63"/>
    </linearGradient>
  </defs>
  <!-- Brand hexagon frame (from the Sysible mark), enclosing a dark terminal. -->
  <path d="M64 10 L111 37 L111 91 L64 118 L17 91 L17 37 Z"
        fill="#0b1526" stroke="url(#hexFrame)" stroke-width="9" stroke-linejoin="round"/>
  <!-- Prompt chevron: royal blue, the accent hue of the wordmark. -->
  <path d="M46 50 L63 64 L46 78" fill="none" stroke="#3f6fe0"
        stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor block: the logo's single green circuit accent, as the blinking cursor. -->
  <rect x="71" y="52" width="15" height="24" rx="3" fill="#3ea832"/>
</svg>
