<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a79e8"/>
      <stop offset="1" stop-color="#1b2f66"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101f39"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
  </defs>
  <!-- Sharp hexagon (mitred), the Sysible mark as a dark terminal screen. -->
  <path d="M64 9 L111 36.5 L111 91.5 L64 119 L17 91.5 L17 36.5 Z"
        fill="url(#screen)" stroke="url(#edge)" stroke-width="5" stroke-linejoin="miter"/>
  <!-- Angular prompt chevron. -->
  <path d="M42 47 L59 64 L42 81" fill="none" stroke="#5b86f0"
        stroke-width="7" stroke-linejoin="miter" stroke-linecap="butt"/>
  <!-- Hollow block cursor: a defined green box with a hole (terminal cursor),
       distinct from the solid download arrow of the install icon. -->
  <rect x="67" y="53.5" width="22" height="22" rx="3.5" fill="none"
        stroke="#5cc746" stroke-width="6"/>
</svg>
