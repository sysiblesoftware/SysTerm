<?xml version="1.0" encoding="UTF-8"?>
<!--
  SysTerm app/dock icon — Sysible SES brand (2026 rebrand).
  Dark rounded tile + thin GREEN RING (#6ddb73) + a ">" terminal prompt with a
  green cursor block. No hexagon. Font-free (pure paths) so it rasterises
  identically everywhere. Regenerate the PNG sizes with cairosvg after editing.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18202c"/>
      <stop offset="1" stop-color="#0b0e15"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="236" height="236" rx="52" fill="url(#tile)"/>
  <rect x="10" y="10" width="236" height="236" rx="52" fill="none" stroke="#6ddb73" stroke-width="6"/>
  <polyline points="92,94 134,128 92,162" fill="none" stroke="#eceff3"
            stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="150" y="150" width="46" height="15" rx="4" fill="#6ddb73"/>
</svg>
